<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diseño de Cajas con Tailwind CSS e Imágenes</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#d1e231] min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-4xl flex flex-col gap-4">

    <!-- Caja 1 -->
    <div class="h-16 border-4 border-slate-500 rounded-md"></div>

    <!-- Caja 2 -->
    <div class="h-16 border-4 border-slate-500 rounded-md"></div>

    <!-- Caja 3 -->
    <div class="h-16 border-4 border-slate-500 rounded-md"></div>

    <!-- Caja 4 (Contenedora de las 6 cajas internas con imágenes y filtros Tailwind) -->
    <div class="border-4 border-[#b25d38] p-6 rounded-md">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-8">

        <!-- 1. Círculo: Blur -->
        <div class="flex flex-col items-center text-center gap-2">
          <span class="text-xl font-bold text-slate-700">blur</span>
          <div class="w-28 h-28 rounded-full overflow-hidden border-2 border-slate-400 shadow-md">
            <img src="imagenes/img1.jpg" alt="blur" class="w-full h-full object-cover blur-sm">
          </div>
        </div>

        <!-- 2. Círculo: Transparente / Opacidad -->
        <div class="flex flex-col items-center text-center gap-2">
          <span class="text-xl font-bold text-slate-700">transparente</span>
          <div class="w-28 h-28 rounded-full overflow-hidden border-2 border-slate-400 shadow-md bg-slate-200">
            <img src="imagenes/img2.jpg" alt="transparente" class="w-full h-full object-cover opacity-50">
          </div>
        </div>

        <!-- 3. Círculo: Escala de Grises -->
        <div class="flex flex-col items-center text-center gap-2">
          <span class="text-xl font-bold text-slate-700">escala de grises</span>
          <div class="w-28 h-28 rounded-full overflow-hidden border-2 border-slate-400 shadow-md">
            <img src="imagenes/img3.jpg" alt="escala de grises" class="w-full h-full object-cover grayscale">
          </div>
        </div>

        <!-- 4. Cuadrado: Intensidad (Saturación) -->
        <div class="flex flex-col items-center text-center gap-2">
          <span class="text-xl font-bold text-slate-700">intensidad</span>
          <div class="w-28 h-28 overflow-hidden border-2 border-slate-400 shadow-md">
            <img src="imagenes/img4.jpg" alt="intensidad" class="w-full h-full object-cover saturate-200">
          </div>
        </div>

        <!-- 5. Cuadrado: Opacidad -->
        <div class="flex flex-col items-center text-center gap-2">
          <span class="text-xl font-bold text-slate-700">opacidad</span>
          <div class="w-28 h-28 overflow-hidden border-2 border-slate-400 shadow-md bg-slate-200">
            <img src="imagenes/img5.jpg" alt="opacidad" class="w-full h-full object-cover opacity-40">
          </div>
        </div>

        <!-- 6. Cuadrado: Libre -->
        <div class="flex flex-col items-center text-center gap-2">
          <span class="text-xl font-bold text-slate-700">libre</span>
          <div class="w-28 h-28 overflow-hidden border-2 border-slate-400 shadow-md">
            <img src="imagenes/img6.jpg" alt="libre" class="w-full h-full object-cover">
          </div>
        </div>

      </div>
    </div>
    <div class="h-16 border-4 border-slate-500 rounded-md flex items-center justify-center font-bold text-slate-800 text-xl">
      diseñado por: ALEJANDRO ARGANA FLORES
    </div>

  </div>

</body>
</html>
